# Sentech HCM — dev/staging topology per ADR-005:
# frontend (nginx: SPA + reverse proxy) -> backend (Django/gunicorn) -> PostgreSQL,
# plus Celery worker + beat on Redis (retention job, ADR-011 reminder job).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hcm}
      POSTGRES_USER: ${POSTGRES_USER:-hcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hcm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env   # includes COLLAB_ENABLED/COLLAB_BASE_URL/COLLAB_API_KEY/HCM_PUBLIC_URL (ADR-011)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media:/app/media
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    command: celery -A config worker --loglevel=info
    # Overrides the backend image's baked-in HEALTHCHECK (curls
    # localhost:8000/readyz, gunicorn's port -- nothing listens on it in
    # this container, so without this override `docker ps` would show
    # worker permanently "unhealthy" regardless of whether it's actually
    # fine). `inspect ping` proves both broker connectivity and that a
    # worker process is actually responsive, not just that the process
    # exists (HR_Code_report.md lower-priority note).
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # CELERY_BEAT_SCHEDULE lives in config/settings.py (retention daily; the
    # performance-agreement reminder job joins it in PC-1).
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    # Same override reasoning as worker's above. Beat has no remote-control
    # command to ping (it schedules, it doesn't consume a queue), so this
    # checks its own persistent schedule store was written to recently --
    # proof beat's tick loop is actually running, not just that the
    # process hasn't crashed. Checks every /tmp/celerybeat-schedule*
    # file, not just the bare name: this store is SQLite (WAL mode) under
    # this Celery/Python version, so ongoing writes land in
    # -wal/-shm and the main file's own mtime only moves on a checkpoint,
    # confirmed by actually running this stack (the bare-filename version
    # of this check first shipped here was reliably ~30 min stale and
    # wrongly reported unhealthy forever). 900s threshold sits safely
    # above the observed ~250-260s tick cadence with real margin; this is
    # a known-imperfect proxy, not a guarantee every scheduled job
    # actually fired -- see the report's own suggestion to also monitor
    # task freshness externally.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import glob,os,sys,time; files=glob.glob('/tmp/celerybeat-schedule*'); sys.exit(0 if files and time.time()-max(os.path.getmtime(f) for f in files)<900 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
  media:
