# nginx in front of the SPA + Django (ADR-005). One origin for the browser:
#   /api/, /admin/, /healthz  -> backend:8000 (gunicorn)
#   everything else           -> the built React app (history-API fallback)
# Media (uploaded policy documents, performance evidence) is NOT served here on
# purpose — Django serves it only through authenticated download endpoints.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;   # matches Django's 20 MB upload cap + headroom

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://backend:8000;   # Django admin static (collectstatic)
        proxy_set_header Host $host;
    }

    # Hashed Vite assets: cache hard. index.html: never cache (deploys must be visible immediately).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
