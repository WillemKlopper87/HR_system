name: hcm-ci

on:
  push:
    paths:
      - "hcm/**"
      - ".github/workflows/hcm-ci.yml"
  pull_request:
    paths:
      - "hcm/**"
      - ".github/workflows/hcm-ci.yml"

jobs:
  backend:
    name: Backend (Django checks, migrations, tests — SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcm/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: hcm/backend/requirements.lock

      - name: Install dependencies (pinned lock)
        run: pip install -r requirements.lock

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Missing-migration guard
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate (SQLite, CI-local)
        run: python manage.py migrate

      - name: Celery app loads and beat schedule resolves
        run: |
          python manage.py shell -c "from config.celery import app; app.loader.import_default_modules(); assert 'rbac_audit.tasks.run_retention_task' in app.tasks, sorted(app.tasks); print('celery ok')"
          python manage.py run_retention --dry-run

      - name: Test suite
        run: python manage.py test --parallel auto

  backend-production-config:
    name: Backend (production secret fail-fast + check --deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcm/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: hcm/backend/requirements.lock

      - name: Install dependencies (pinned lock)
        run: pip install -r requirements.lock

      # H2 (HR_Code_report.md): a weak/default/absent secret must refuse to
      # start at all once DEBUG=0 -- config/settings.py's
      # _require_production_secret raises ImproperlyConfigured at import
      # time, so this can only be proven with a real subprocess, not
      # override_settings() inside a normal test (see config/test_settings.py's
      # own docstring for why that unit test stops short of this).
      - name: A weak secret must refuse to start under DEBUG=0
        run: |
          set +e
          DJANGO_DEBUG=0 DJANGO_SECRET_KEY=change-me python manage.py check
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::manage.py check succeeded with a weak SECRET_KEY under DEBUG=0 -- the H2 fail-fast guard regressed."
            exit 1
          fi

      - name: Production-style check --deploy with real secrets
        run: |
          export DJANGO_DEBUG=0
          export DJANGO_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          export ASSESSMENT_WEBHOOK_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          export DJANGO_ALLOWED_HOSTS=hcm-ci.example.com
          # Simulates an operator who HAS made the HSTS subdomain/preload
          # decision (config/settings.py leaves both off by default,
          # deliberately -- see its own comment) so this job proves the
          # rest of the deploy-check surface is clean rather than
          # perpetually red on a decision CI can't make.
          export DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=1
          export DJANGO_SECURE_HSTS_PRELOAD=1
          python manage.py check --deploy --fail-level WARNING

  backend-postgres:
    name: Backend (tests — PostgreSQL 17, the production engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcm/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hcm
          POSTGRES_USER: hcm
          POSTGRES_PASSWORD: hcm-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hcm
      POSTGRES_USER: hcm
      POSTGRES_PASSWORD: hcm-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: hcm/backend/requirements.lock

      - name: Install dependencies (pinned lock)
        run: pip install -r requirements.lock

      - name: Migrate (PostgreSQL)
        run: python manage.py migrate

      - name: Seed demo data (exercises every app's models on Postgres)
        run: python manage.py seed_demo_data

      - name: Test suite (PostgreSQL)
        run: python manage.py test --parallel auto

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hcm/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: hcm/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

  contract-drift:
    name: Contract (OpenAPI schema + generated types stay in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: hcm/backend/requirements.lock

      - name: Install backend dependencies (pinned lock)
        working-directory: hcm/backend
        run: pip install -r requirements.lock

      # M2 (HR_Code_report.md): "CI validates neither OpenAPI generation nor
      # regeneration/diff of generated-types.ts. Backend serializer changes
      # can therefore drift from the committed generated output ... without
      # failing the build." --fail-on-warn also catches the schema-naming
      # class of issue M3 fixed (ENUM_NAME_OVERRIDES) from ever silently
      # coming back.
      - name: Schema validates with zero warnings
        working-directory: hcm/backend
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema-check.yml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: |
            hcm/frontend/package-lock.json
            hcm/frontend/tools/api-codegen/package-lock.json

      - name: Install frontend + codegen dependencies
        run: |
          npm ci --prefix hcm/frontend
          npm ci --prefix hcm/frontend/tools/api-codegen

      - name: Regenerate src/api/generated-types.ts and fail on drift
        env:
          PYTHON: python
        run: |
          npm run generate:api-types --prefix hcm/frontend
          git diff --exit-code -- hcm/frontend/src/api/generated-types.ts

  e2e:
    name: E2E (Playwright — real browser against seeded Django + Vite)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: hcm/backend/requirements.lock

      - name: Install backend dependencies (pinned lock)
        working-directory: hcm/backend
        run: pip install -r requirements.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: hcm/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: hcm/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: hcm/frontend
        # --with-deps runs apt; a runner-side apt lock once hung this for 40+ min,
        # so cap it rather than let the whole run sit.
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: hcm/frontend
        timeout-minutes: 15
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: hcm/frontend/playwright-report/
          retention-days: 7
